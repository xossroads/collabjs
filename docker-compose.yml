services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  app:
    # AdSense ids come from a root .env on the deploy host (gitignored):
    #   VITE_ADSENSE_CLIENT=ca-pub-xxxxxxxxxxxxxxxx
    #   VITE_ADSENSE_SLOT=xxxxxxxxxx
    # Baked into the client bundle at build time (args) and used at runtime to
    # generate /ads.txt (ADSENSE_CLIENT). Unset = no ads served.
    build:
      context: .
      args:
        VITE_ADSENSE_CLIENT: ${VITE_ADSENSE_CLIENT:-}
        VITE_ADSENSE_SLOT: ${VITE_ADSENSE_SLOT:-}
    expose:
      - "3000"
      - "3001"
    environment:
      - DATABASE_URL=postgresql://collabjs:collabjs@db:5432/collabjs
      - PORT=3000
      - API_PORT=3001
      - NODE_ENV=production
      - ADSENSE_CLIENT=${VITE_ADSENSE_CLIENT:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    environment:
      - POSTGRES_USER=collabjs
      - POSTGRES_PASSWORD=collabjs
      - POSTGRES_DB=collabjs
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collabjs -d collabjs"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
