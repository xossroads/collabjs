<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>sandbox</title>
</head>
<body>
<!--
  Loaded into a sandboxed iframe (sandbox="allow-scripts", no
  allow-same-origin) by the parent page. The sandbox attribute gives this
  document an opaque origin, so even though it's served from the same host
  as the parent it cannot read the parent's cookies, localStorage, DOM, or
  make credentialed requests to its own APIs as the logged-in user.

  We're loaded via iframe.src (not srcdoc) so that the parent's CSP does
  not apply here. That lets the parent run a strict CSP without unsafe-eval,
  while we keep the `new Function` call we need to execute user code.
-->
<script>
(function () {
  'use strict';

  function stringify(value) {
    if (value === undefined) return 'undefined';
    if (value === null) return 'null';
    if (typeof value === 'function') return value.toString();
    if (typeof value === 'object') {
      try { return JSON.stringify(value, null, 2); }
      catch (_) { return String(value); }
    }
    return String(value);
  }

  function send(msg) {
    parent.postMessage(msg, '*');
  }

  var sandboxConsole = {
    log:   function () { send({ kind: 'log',   content: Array.prototype.map.call(arguments, stringify).join(' ') }); },
    error: function () { send({ kind: 'error', content: Array.prototype.map.call(arguments, stringify).join(' ') }); },
    warn:  function () { send({ kind: 'warn',  content: Array.prototype.map.call(arguments, stringify).join(' ') }); },
    info:  function () { send({ kind: 'info',  content: Array.prototype.map.call(arguments, stringify).join(' ') }); }
  };

  window.addEventListener('message', function (e) {
    var data = e.data;
    if (!data || data.kind !== 'execute') return;
    var code = String(data.code || '');

    try {
      var fn = new Function('console', code);
      var result = fn(sandboxConsole);
      if (result !== undefined) {
        send({ kind: 'result', content: stringify(result) });
      }
      send({ kind: 'done' });
    } catch (err) {
      var msg;
      if (err instanceof Error) {
        msg = err.name + ': ' + err.message;
        var lineMatch = err.stack && err.stack.match(/<anonymous>:(\d+):/);
        if (lineMatch) {
          var offset = err instanceof SyntaxError ? 1 : 2;
          var line = parseInt(lineMatch[1], 10) - offset;
          if (line > 0) msg += ' (line ' + line + ')';
        }
      } else {
        msg = String(err);
      }
      send({ kind: 'error', content: msg });
      send({ kind: 'done' });
    }
  });

  window.addEventListener('error', function (e) {
    send({ kind: 'error', content: 'UncaughtError: ' + e.message });
  });

  window.addEventListener('unhandledrejection', function (e) {
    var reason = e.reason;
    var content = (reason && reason.message) ? reason.message : String(reason);
    send({ kind: 'error', content: 'UnhandledRejection: ' + content });
  });

  send({ kind: 'ready' });
})();
</script>
</body>
</html>
