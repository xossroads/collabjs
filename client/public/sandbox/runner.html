<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>sandbox</title>
</head>
<body>
<!--
  Loaded into a sandboxed iframe (sandbox="allow-scripts", no
  allow-same-origin) by the parent page. The sandbox attribute gives this
  document an opaque origin, so even though it's served from the same host
  as the parent it cannot read the parent's cookies, localStorage, DOM, or
  make credentialed requests to its own APIs as the logged-in user.

  We're loaded via iframe.src (not srcdoc) so that the parent's CSP does
  not apply here. That lets the parent run a strict CSP without unsafe-eval,
  while we keep the `new Function` call we need to execute user code.
-->
<script>
'use strict';

const stringify = (value) => {
  if (value === undefined) return 'undefined';
  if (value === null) return 'null';
  if (typeof value === 'function') return value.toString();
  if (typeof value === 'object') {
    try { return JSON.stringify(value, null, 2); }
    catch { return String(value); }
  }
  return String(value);
};

// Format a thrown value the way the console panel expects. Errors from user
// code (run via `new Function`) carry <anonymous> stack frames, from which we
// recover the user-facing line number — syntax vs runtime sit at a different
// wrapper offset.
const formatError = (err) => {
  if (!(err instanceof Error)) return String(err);
  let msg = `${err.name}: ${err.message}`;
  const lineMatch = err.stack?.match(/<anonymous>:(\d+):/);
  if (lineMatch) {
    const offset = err instanceof SyntaxError ? 1 : 2;
    const line = parseInt(lineMatch[1], 10) - offset;
    if (line > 0) msg += ` (line ${line})`;
  }
  return msg;
};

// True only for errors originating in user code. `new Function` makes user
// code's stack frames read <anonymous>; anything without that frame was
// injected into this document by the edge/CDN or a browser extension (e.g.
// Cloudflare's RUM beacon, which throws a cross-origin SecurityError inside
// our opaque-origin sandbox) and must not be reported as the user's error.
const isUserError = (err) => err instanceof Error && !!err.stack?.includes('<anonymous>');

const send = (msg) => parent.postMessage(msg, '*');

const captured = (kind) => (...args) =>
  send({ kind, content: args.map(stringify).join(' ') });

const sandboxConsole = {
  log:   captured('log'),
  error: captured('error'),
  warn:  captured('warn'),
  info:  captured('info'),
};

window.addEventListener('message', (e) => {
  const data = e.data;
  if (!data || data.kind !== 'execute') return;
  const code = String(data.code ?? '');

  try {
    const fn = new Function('console', code);
    const result = fn(sandboxConsole);
    if (result !== undefined) {
      send({ kind: 'result', content: stringify(result) });
    }
    send({ kind: 'done' });
  } catch (err) {
    send({ kind: 'error', content: formatError(err) });
    send({ kind: 'done' });
  }
});

window.addEventListener('error', (e) => {
  if (!isUserError(e.error)) return;
  send({ kind: 'error', content: `UncaughtError: ${formatError(e.error)}` });
});

window.addEventListener('unhandledrejection', (e) => {
  const reason = e.reason;
  // Drop Error rejections that carry no user-code frame (injected scripts);
  // non-Error reasons (strings, etc.) can only come from user code here.
  if (reason instanceof Error && !isUserError(reason)) return;
  const content = reason?.message ?? String(reason);
  send({ kind: 'error', content: `UnhandledRejection: ${content}` });
});

send({ kind: 'ready' });
</script>
</body>
</html>
