<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    Landing page CSP. Unlike the app, the landing loads no editor, sandbox, or
    WebSocket — so no ws:/frame-src, and styles are external (no 'unsafe-inline').
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <meta name="description" content="CollabJS — a real-time collaborative JavaScript editor. Share a link and code together, instantly.">
  <title>CollabJS — Collaborative JavaScript Editor</title>
  <link rel="stylesheet" href="/src/landing.css">
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>

  <main class="stage">
    <header class="wordmark reveal s0">
      <span class="wordmark-collab">Collab</span><span class="wordmark-js">JS</span>
    </header>

    <section class="window" aria-label="CollabJS">
      <div class="window-bar reveal s1">
        <span class="dot dot-r"></span><span class="dot dot-y"></span><span class="dot dot-g"></span>
        <span class="window-title">collab — main.js</span>
      </div>
      <div class="code"><code><span class="line reveal s2"><span class="ln">1</span><span class="cm">// real-time collaborative JavaScript —</span></span><span class="line reveal s3"><span class="ln">2</span><span class="cm">// share a link, code together, live.</span></span><span class="line reveal s4"><span class="ln">3</span></span><span class="line reveal s5"><span class="ln">4</span><span class="kw">const</span> <span class="vr">room</span> <span class="op">=</span> <span class="kw">await</span> <span class="vr">collab</span><span class="op">.</span><span class="fn">start</span><span class="op">()</span></span><span class="line reveal s6"><span class="ln">5</span><span class="caret"></span></span></code></div>
    </section>

    <a id="start" class="cta reveal s7" href="/">
      <span class="cta-run">&#9654;</span> Start coding
    </a>

    <footer class="foot reveal s8">
      <a href="https://github.com/xossroads/collabjs" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </main>

  <script type="module" src="/src/landing.ts"></script>
</body>
</html>
