# Local dev/preview nginx: plain HTTP, no TLS, no Cloudflare origin lock.
#
# Used ONLY via docker-compose.dev.yml. Deliberately kept OUT of the nginx/
# directory: prod mounts that whole dir into conf.d, so a proxy server here
# would leak in and bypass the TLS redirect + CF allowlist. Keep it at repo root.
server {
    listen 80;

    location / {
        proxy_pass http://app:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
